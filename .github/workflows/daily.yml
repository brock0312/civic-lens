name: daily

# 需要到 repo 設定手動完成（workflow 無法自行設定）：
#   1. Settings → Actions → General → Workflow permissions 選「Read repository contents and packages permission」，
#      讓日後新增的 workflow 預設唯讀（本檔每個 job 都自己宣告權限，不依賴預設值）
#   2. Settings → Advanced Security（或 Code security）→ 開啟 Secret scanning 與 Push protection
#   3. Settings → Pages → Build and deployment → Source 選「GitHub Actions」
#      （不要選 Deploy from a branch：那會把 docs/、tests/、data/ 一起公開）
#
# 資料更新以本機（臺灣網路）為準：tcc.gov.tw、內政部、中選會開票 JSON 擋海外 IP，GitHub 機器抓不到，所以不跑排程
#
# push 到 main（正式路徑）：test（唯讀，跑單元測試並檢查 data/civic.sql）→ deploy（只部署這次 push 的 commit）
# - test 失敗：不部署
#
# 手動觸發（workflow_dispatch，僅供備用）：etl（唯讀、處理外部輸入）→ commit（只搬 data/civic.sql）→ deploy（在 main 的程式上重建 site/data，只部署 site/）
# - 測試失敗：不上傳 dump → 不 commit、不部署
# - 部分來源失敗：run.py 先 dump（失敗的來源 rollback），etl job 標為失敗，但已成功的資料照樣 commit 並部署
# - commit job 用 GITHUB_TOKEN push，不會再觸發本 workflow 的 push 事件
#
# action 一律釘完整 commit SHA；更新時用 gh api repos/<owner>/<repo>/git/ref/tags/<tag> 查 SHA（annotated tag 要再解一層）

on:
  # 手動觸發保留備用；被擋的來源在 GitHub 機器上一定失敗，正式的資料更新以本機為準（見 README「資料更新」）
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}   # workflow 預設沒有任何權限，各 job 自己宣告

# ETL 執行之間互相排隊、不中途取消（中途取消會丟掉當次抓到的資料）；push 的部署另成一組，不排在 ETL 後面，也不會把排隊中的 ETL 擠掉
concurrency:
  group: daily-${{ github.event_name == 'push' && 'deploy' || 'etl' }}
  cancel-in-progress: false

jobs:
  test:
    # push 時的部署關卡：唯讀，checkout 不留 token；測試放在這裡跑，有 Pages 權限的 deploy job 不執行測試
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install poppler (pdftotext, pdftohtml, pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m unittest -v
      - name: Check data/civic.sql
        # 與 commit job 的 Check dump 相同：本機推上來的 dump 也要完整、且不含生日（B1）
        # 推上來時 dump 已在公開 repo，這裡擋不住外洩，只能擋部署並亮紅燈；推之前要先照 README 自行檢查
        env:
          DUMP: data/civic.sql
        run: |
          test "$(tail -n 1 "$DUMP")" = 'COMMIT;' || { echo '::error::dump 不完整'; exit 1; }
          grep -q '^INSERT INTO "person" VALUES' "$DUMP" || { echo '::error::dump 沒有 person 列'; exit 1; }
          not_null=$(grep '^INSERT INTO "person" VALUES' "$DUMP" | grep -vc ',NULL,NULL);$' || true)
          dated=$(grep -cE "^INSERT INTO \"person\" VALUES.*'[0-9]{4}-[0-9]{2}-[0-9]{2}'" "$DUMP" || true)
          if [ "$not_null" != 0 ] || [ "$dated" != 0 ]; then
            echo "::error::person 列含有生日（非 NULL ${not_null} 列、日期格式 ${dated} 列）"
            exit 1
          fi

  etl:
    # 處理政府網站下載的 PDF／HTML（外部輸入）：唯讀權限，checkout 不留 token
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dump_uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install poppler (pdftotext, pdftohtml, pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - id: test
        run: python -m unittest -v
      - name: Run ETL
        run: python -m etl.run
      - id: upload
        # 測試通過才上傳；ETL 部分失敗時仍上傳（run.py 已先 dump）
        if: ${{ !cancelled() && steps.test.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dump
          path: data/civic.sql
          if-no-files-found: error
          retention-days: 3

  commit:
    # 有寫入權限：只跑 git 與 grep，不執行 repo 或 dump 裡的任何程式
    needs: etl
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.etl.outputs.dump_uploaded == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dump
          path: ${{ runner.temp }}/dump
      - name: Check dump
        env:
          DUMP: ${{ runner.temp }}/dump/civic.sql
        run: |
          # dump 要完整寫完：iterdump 最後一行是 COMMIT;，截斷的 dump 會讓下次執行遺失資料
          test "$(tail -n 1 "$DUMP")" = 'COMMIT;' || { echo '::error::dump 不完整'; exit 1; }
          grep -q '^INSERT INTO "person" VALUES' "$DUMP" || { echo '::error::dump 沒有 person 列'; exit 1; }
          # B1：生日不得進公開 dump（etl/db.py 的 dump() 會清空；這裡再擋一次）
          # person 列的最後兩欄（birth_date, birth_year）必須都是 NULL，也不得出現 YYYY-MM-DD
          # 用 -c 計數而不是 grep -q：-q 提早結束會讓上游 SIGPIPE，在 pipefail 下變成「沒命中」而放行
          not_null=$(grep '^INSERT INTO "person" VALUES' "$DUMP" | grep -vc ',NULL,NULL);$' || true)
          dated=$(grep -cE "^INSERT INTO \"person\" VALUES.*'[0-9]{4}-[0-9]{2}-[0-9]{2}'" "$DUMP" || true)
          if [ "$not_null" != 0 ] || [ "$dated" != 0 ]; then
            echo "::error::person 列含有生日（非 NULL ${not_null} 列、日期格式 ${dated} 列），拒絕 commit"
            exit 1
          fi
      - name: Commit data dump
        env:
          DUMP: ${{ runner.temp }}/dump/civic.sql
        run: |
          cp "$DUMP" data/civic.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data/civic.sql
          if git diff --cached --quiet; then
            echo '資料沒有變動'
          else
            git commit -m 'chore: daily data update'
            git push origin HEAD:main
          fi

  deploy:
    needs: [commit, test]
    # push：etl／commit 為 skipped，test 成功才部署；手動：test 為 skipped，commit 成功才部署（測試失敗時 commit 為 skipped）
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (
      (github.event_name == 'push' && needs.test.result == 'success') ||
      (github.event_name != 'push' && needs.commit.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # push：部署 test 驗過的那個 commit，不取 main 最新（可能是還沒測過的下一次 push）
          # 手動：取 commit job 剛推上去的 dump；程式也用 main 上的版本，不沿用 etl job 的產出
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Export site/data
        # open_db 禁止 ATTACH，被竄改的 dump 無法在 site/ 寫出額外檔案；暫存 DB 放在 site/ 之外
        run: >-
          python -c "import sys; from etl.db import open_db; from etl.export import export;
          export(open_db(sys.argv[1], 'data/civic.sql'), 'site/data')" "$RUNNER_TEMP/civic.db"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site   # 只部署 site/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
